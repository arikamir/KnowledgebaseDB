apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: career-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: career-agent-delivery
    gitops.knowledgebase.io/managed-by: platform-operations
spec:
  description: GitOps delivery for the DevOps Career Agent services and bounded pre-sync migration Job.
  sourceRepos:
    - https://github.com/arikamir/KnowledgebaseDB.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: career-agent
    - server: https://kubernetes.default.svc
      namespace: career-migrations
  # The ApplicationSet cannot mutate cluster-scoped platform resources. The
  # application and migration namespaces, identities, admission policy, and
  # runtime configuration are provisioned before this project is installed.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: batch
      kind: Job
  orphanedResources:
    warn: true
