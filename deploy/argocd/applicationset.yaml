apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: career-agent-services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: career-agent-delivery
    gitops.knowledgebase.io/managed-by: platform-operations
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/arikamir/KnowledgebaseDB.git
        revision: main
        requeueAfterSeconds: 180
        files:
          # The first target is explicitly non-production UAE North. A new
          # environment requires a separately reviewed ApplicationSet rather
          # than silently reusing this destination.
          - path: deploy/argocd/environments/nonprod/release.json
  template:
    metadata:
      name: career-agent-{{.environment}}
      labels:
        app.kubernetes.io/part-of: career-agent
        app.kubernetes.io/managed-by: argocd
        gitops.knowledgebase.io/environment: '{{.environment}}'
        gitops.knowledgebase.io/release-version: '{{.releaseVersion}}'
      annotations:
        gitops.knowledgebase.io/source-revision: '{{.sourceRevision}}'
        gitops.knowledgebase.io/release-manifest: deploy/argocd/environments/{{.environment}}/release.json
    spec:
      project: career-agent
      sources:
        - repoURL: https://github.com/arikamir/KnowledgebaseDB.git
          targetRevision: main
          path: deploy/k8s/overlays/argocd-nonprod
          kustomize:
            # The source manifests deliberately keep platform placeholders. The
            # release declaration supplies immutable service images at render
            # time; no mutable tag can become the deployment identity.
            images:
              - 'career-agent/ui={{.services.ui.image}}'
              - 'career-agent/bff={{.services.bff.image}}'
              - 'career-agent/core={{.services.core.image}}'
        - repoURL: https://github.com/arikamir/KnowledgebaseDB.git
          targetRevision: main
          path: deploy/k8s/overlays/argocd-nonprod-migration
          kustomize:
            # The PreSync Job runs the migration entrypoint from the exact Core
            # digest before Argo CD is allowed to update any service workload.
            images:
              - 'career-agent/core={{.services.core.image}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: career-agent
      revisionHistoryLimit: 10
      syncPolicy:
        automated:
          allowEmpty: false
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=false
          - FailOnSharedResource=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
          - ServerSideApply=true
