apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-certificate-readiness
  namespace: career-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-certificate-readiness
  namespace: career-agent
subjects:
  - kind: ServiceAccount
    name: gateway-certificate-rotation
    namespace: career-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-certificate-readiness
