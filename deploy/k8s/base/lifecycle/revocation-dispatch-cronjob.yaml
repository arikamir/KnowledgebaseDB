apiVersion: batch/v1
kind: CronJob
metadata:
  name: lifecycle-revocation-dispatch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels: {app.kubernetes.io/name: lifecycle-revocation-dispatch, azure.workload.identity/use: "true"}
        spec:
          serviceAccountName: lifecycle
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: revocation-dispatch
              image: "${CORE_IMAGE_REPOSITORY}@${CORE_IMAGE_DIGEST}"
              command: ["python", "-m", "lifecycle.dispatch_session_revocations"]
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: 200m, memory: 192Mi}
