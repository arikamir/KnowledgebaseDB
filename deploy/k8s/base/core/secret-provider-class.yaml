apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: core-key-vault-material
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${CORE_WORKLOAD_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${ENTRA_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: private-core-server
          objectType: secret
          objectVersion: "${PRIVATE_CORE_CERTIFICATE_VERSION}"
          objectAlias: core-tls.pem
        - |
          objectName: private-core-server
          objectType: cert
          objectVersion: "${PRIVATE_CORE_CERTIFICATE_VERSION}"
          objectAlias: core-chain.pem
