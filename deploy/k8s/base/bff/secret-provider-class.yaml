apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bff-key-vault-material
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${BFF_WORKLOAD_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${ENTRA_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: bff-confidential-client
          objectType: secret
          objectVersion: "${BFF_CLIENT_CERTIFICATE_VERSION}"
          objectAlias: bff-client.pem
        - |
          objectName: private-core-server
          objectType: cert
          objectVersion: "${PRIVATE_CORE_CERTIFICATE_VERSION}"
          objectAlias: core-ca.pem
