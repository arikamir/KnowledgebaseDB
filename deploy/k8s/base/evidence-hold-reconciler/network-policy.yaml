apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evidence-hold-reconciler-egress
  namespace: evidence-hold-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evidence-hold-reconciler
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: ${AZURE_STORAGE_PRIVATE_ENDPOINT_CIDR}
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - {port: 80, protocol: TCP}
