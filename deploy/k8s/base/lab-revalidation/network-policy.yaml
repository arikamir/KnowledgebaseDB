apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lab-revalidation-public-https-only}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: lab-revalidation}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 224.0.0.0/4, 240.0.0.0/4]
      ports: [{protocol: TCP, port: 443}]
    - to:
        - ipBlock: {cidr: "${AZURE_PRIVATE_SERVICE_CIDR}"}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
