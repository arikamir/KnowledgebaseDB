apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels: {app.kubernetes.io/name: ui, app.kubernetes.io/component: presentation}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ui, app.kubernetes.io/component: presentation}
    spec:
      serviceAccountName: ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ui}
      containers:
        - name: ui
          image: "${UI_IMAGE_REPOSITORY}@${UI_IMAGE_DIGEST}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: runtime-config, mountPath: /usr/share/nginx/html/runtime-config.json, subPath: runtime-config.json, readOnly: true}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -s /usr/share/nginx/html/runtime-config.json"]
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: runtime-config
          configMap: {name: ui-runtime-config}
        - {name: nginx-cache, emptyDir: {sizeLimit: 32Mi}}
        - {name: nginx-run, emptyDir: {sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
