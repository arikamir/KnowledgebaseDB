apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-career-agent
  labels:
    app.kubernetes.io/name: devops-career-agent
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-career-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-career-agent
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: devops-career-agent
          image: devops-career-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: devops-career-agent-runtime
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
