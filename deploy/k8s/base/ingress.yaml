apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-career-agent
  labels:
    app.kubernetes.io/name: devops-career-agent
    app.kubernetes.io/component: web
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-career-agent
                port:
                  name: http
