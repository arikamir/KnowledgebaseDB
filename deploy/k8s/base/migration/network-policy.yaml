apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-migration-egress
  namespace: career-migrations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core-migration
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: ${POSTGRES_PRIVATE_ENDPOINT_IP}/32
      ports:
        - port: 5432
          protocol: TCP
