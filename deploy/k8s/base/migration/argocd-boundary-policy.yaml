apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: core-migration-argocd-boundary-v1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Namespaced
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:argocd:argocd-application-controller'
        || (request.operation == 'DELETE' ? oldObject.kind == 'Job' : object.kind == 'Job')
      message: The Argo CD application controller may mutate only Jobs in the migration namespace.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: core-migration-argocd-boundary-v1
spec:
  policyName: core-migration-argocd-boundary-v1
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        knowledgebase.io/migration-guardrails: enforced
