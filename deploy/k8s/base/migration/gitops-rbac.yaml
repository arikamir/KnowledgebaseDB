apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-migration-gitops-controller
  namespace: career-migrations
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-migration-gitops-controller
  namespace: career-migrations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-migration-gitops-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
