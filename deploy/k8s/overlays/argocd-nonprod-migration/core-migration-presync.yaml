apiVersion: batch/v1
kind: Job
metadata:
  name: core-migration
  namespace: career-migrations
  labels:
    app.kubernetes.io/name: core-migration
    app.kubernetes.io/component: schema-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-migration
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: core-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core-migration
          image: career-agent/core
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/run-migration.sh
          args:
            - upgrade
            - $(MIGRATION_TARGET)
          env:
            - name: MIGRATION_TARGET
              value: 009_merge_learning_progress
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: core-migration-policy-v1
                  key: databaseUrl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes: []
