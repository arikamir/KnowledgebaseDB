apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is deliberately an application-only overlay. The namespace, gateway,
# private load balancer, workload identities, runtime ConfigMaps,
# SecretProviderClasses, and pull secret remain platform-owned. The service
# bases are retained for the shared workload definitions, while the delete
# patch removes platform-owned objects from this Argo CD render.
namespace: career-agent
resources:
  - ../../base/ui
  - ../../base/bff
  - ../../base/core
patches:
  - path: application-images.yaml
  - path: platform-resource-deletions.yaml
