apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is deliberately an application-only overlay. The namespace, gateway,
# private load balancer, and platform controllers remain infrastructure-owned.
namespace: career-agent
resources:
  - ../../base/ui
  - ../../base/bff
  - ../../base/core
patches:
  - path: application-images.yaml
