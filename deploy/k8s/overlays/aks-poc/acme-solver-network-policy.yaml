apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-from-public-gateway
  namespace: career-agent
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8089}
