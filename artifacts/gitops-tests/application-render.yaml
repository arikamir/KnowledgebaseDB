apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: career-agent
spec:
  ports:
  - name: http
    port: 3000
    targetPort: http
  selector:
    app.kubernetes.io/name: bff
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: career-agent
spec:
  ports:
  - name: https
    port: 8443
    targetPort: https
  selector:
    app.kubernetes.io/name: core
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: career-agent
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: ui
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: composition
    app.kubernetes.io/name: bff
  name: bff
  namespace: career-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/component: composition
        app.kubernetes.io/name: bff
        azure.workload.identity/use: "true"
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: BFF_CLIENT_CERTIFICATE_PATH
          value: /var/run/secrets/career-agent/bff-client.pem
        - name: CORE_CA_BUNDLE_PATH
          value: /var/run/secrets/career-agent/core-ca.pem
        - name: KEY_MATERIAL_FAILURE_CODE
          value: KEY_MATERIAL_UNAVAILABLE
        - name: KEY_MATERIAL_FALLBACK
          value: disabled
        envFrom:
        - configMapRef:
            name: bff-runtime-config
        image: career-agent/bff
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        name: bff
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/career-agent
          name: key-vault-material
          readOnly: true
      imagePullSecrets:
      - name: career-agent-acr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: bff
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: bff
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: bff-key-vault-material
        name: key-vault-material
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: domain-api
    app.kubernetes.io/name: core
  name: core
  namespace: career-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: core
  template:
    metadata:
      labels:
        app.kubernetes.io/component: domain-api
        app.kubernetes.io/name: core
        azure.workload.identity/use: "true"
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - api.app:app
        - --host
        - 0.0.0.0
        - --port
        - "8443"
        - --ssl-certfile
        - /var/run/secrets/career-agent/core-tls.pem
        - --ssl-keyfile
        - /var/run/secrets/career-agent/core-tls.pem
        command:
        - uvicorn
        env:
        - name: CORE_TLS_PEM_PATH
          value: /var/run/secrets/career-agent/core-tls.pem
        - name: CORE_TLS_CHAIN_PATH
          value: /var/run/secrets/career-agent/core-chain.pem
        - name: KEY_MATERIAL_FAILURE_CODE
          value: KEY_MATERIAL_UNAVAILABLE
        - name: KEY_MATERIAL_FALLBACK
          value: disabled
        envFrom:
        - configMapRef:
            name: core-runtime-config
        image: career-agent/core
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: https
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 2
        name: core
        ports:
        - containerPort: 8443
          name: https
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health/ready
            port: https
            scheme: HTTPS
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/career-agent
          name: key-vault-material
          readOnly: true
      imagePullSecrets:
      - name: career-agent-acr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: core
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: core
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: core-key-vault-material
        name: key-vault-material
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: presentation
    app.kubernetes.io/name: ui
  name: ui
  namespace: career-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: presentation
        app.kubernetes.io/name: ui
    spec:
      automountServiceAccountToken: false
      containers:
      - image: career-agent/ui
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        name: ui
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - test -s /usr/share/nginx/html/runtime-config.json
          failureThreshold: 15
          periodSeconds: 2
        volumeMounts:
        - mountPath: /usr/share/nginx/html/runtime-config.json
          name: runtime-config
          readOnly: true
          subPath: runtime-config.json
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run
          name: nginx-run
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: career-agent-acr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ui
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: ui
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: ui-runtime-config
        name: runtime-config
      - emptyDir:
          sizeLimit: 32Mi
        name: nginx-cache
      - emptyDir:
          sizeLimit: 8Mi
        name: nginx-run
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff
  namespace: career-agent
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core
  namespace: career-agent
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ui
  namespace: career-agent
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff
  namespace: career-agent
spec:
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core
  namespace: career-agent
spec:
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui
  namespace: career-agent
spec:
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui
