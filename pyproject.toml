[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-career-agent"
version = "0.1.0"
description = "Internal AI agent for DevOps career guidance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "azure-identity>=1.19,<2.0",
  "cryptography>=43,<47",
  "fastapi>=0.116,<1.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt[crypto]>=2.9,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "pyyaml>=6.0,<7.0",
  "redis>=5.1,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-postgresql>=6.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
