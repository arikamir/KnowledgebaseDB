        contractVersion:
          type: string
        acceptedBffContractRange:
          type: string
        apiSchemaVersion:
          type: string
        guidanceTopicCatalogVersion:
          type: string
        compatible:
          type: boolean
    BrowserSessionState:
      oneOf:
        - $ref: "#/components/schemas/AuthenticatedSession"
        - $ref: "#/components/schemas/MissingSession"
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
