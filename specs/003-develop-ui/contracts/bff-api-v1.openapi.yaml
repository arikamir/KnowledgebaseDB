openapi: 3.1.0
info:
  title: DevOps Career Agent Browser BFF API
  version: 1.0.0
  description: >-
    Canonical UI-to-BFF contract. Browser-facing payloads are presentation-safe
    camelCase DTOs. The BFF validates this boundary, maps to the private core
    contract, and never exposes OAuth tokens, authority claims, answer keys, or
    another employee's identifiers.
servers:
  - url: /bff/v1
security:
  - sessionCookie: []
paths:
  /capabilities:
    get:
      operationId: getBffCapabilities
      security: []
      responses:
        "200":
          description: BFF, UI, core, schema, and topic compatibility metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BffCapabilities"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /session:
    get:
      operationId: getBrowserSession
      security: []
      responses:
        "200":
          description: Authenticated session or deterministic missing-session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionState"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    get:
      operationId: beginLogin
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: >-
            Same-origin relative path. BFF parses and canonicalizes it, requires
            origin equality with the configured UI origin, and rejects absolute
            or network paths, backslashes, controls, fragments, and encoded path
            separators before storing auth state.
          schema:
            type: string
            pattern: '^/(?!/)(?!.*[\\\x00-\x1F\x7F#])(?!.*%(?:2[fF]|5[cC])).*$'
      responses:
        "302":
          description: Redirect to the tenant-specific Entra authorization endpoint.
          headers:
            Location:
              $ref: "#/components/headers/RedirectLocation"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/callback:
    get:
      operationId: completeLogin
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
      responses:
        "303":
          description: Active lifecycle gate passed; redirect to stored UI path.
          headers:
            Location:
              $ref: "#/components/headers/RedirectLocation"
            Set-Cookie:
              $ref: "#/components/headers/IssuedSessionCookie"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: logout
      security:
        - {}
        - sessionCookie: []
      x-optional-invalid-session-cleanup: true
      description: >-
        Intrinsically idempotent: exact allowed Origin is always required. An
        active session additionally requires its matching CSRF token and is
        revoked. A missing, expired, unknown, or already-revoked session follows
        the authority-neutral cleanup branch and still returns the cookie-
        clearing redirect, including after a lost first response. This route
        does not accept a domain Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/LogoutCsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "303":
          description: >-
            Active local session revoked when present; cookie always cleared
            before the validated Entra redirect.
          headers:
            Location:
              $ref: "#/components/headers/RedirectLocation"
            Set-Cookie:
              $ref: "#/components/headers/ClearedSessionCookie"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /roadmaps:
    get:
      operationId: listBrowserRoadmaps
      responses:
        "200":
          description: Employee-owned persisted roadmaps for refresh restoration.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerRoadmap"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    post:
      operationId: createBrowserRoadmap
      parameters:
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapCreateRequest"
      responses:
        "200":
          description: Discriminated ready roadmap or required clarifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapResult"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /roadmaps/{id}:
    get:
      operationId: getBrowserRoadmap
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Employee-owned persisted roadmap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerRoadmap"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /guidance:
    post:
      operationId: createBrowserGuidance
      parameters:
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuidanceRequest"
      responses:
        "200":
          description: Catalog-backed guidance and safe lab references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidanceResult"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: >-
            VALIDATION_FAILED, GUIDANCE_TOPIC_UNINTERPRETABLE, or
            GUIDANCE_TOPIC_UNAVAILABLE; rejected before idempotency claim or
            downstream work.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /progress/check-ins:
    post:
      operationId: createBrowserProgressCheckIn
      parameters:
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressCheckInRequest"
      responses:
        "200":
          description: Persisted progress review with exactly one next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReview"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /progress/reviews:
    get:
      operationId: getBrowserProgressReview
      parameters:
        - $ref: "#/components/parameters/RoadmapIdQuery"
      responses:
        "200":
          description: Latest employee-owned persisted progress review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReview"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions:
    get:
      operationId: listBrowserLearningSessions
      parameters:
        - $ref: "#/components/parameters/RoadmapIdQuery"
      responses:
        "200":
          description: Employee-owned learning sessions for a roadmap.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningSession"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{id}:
    get:
      operationId: getBrowserLearningSession
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Persisted learning session and current cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{id}/start:
    post:
      operationId: startBrowserLearningSession
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Started or resumed learning session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{id}/steps/{stepId}/completion:
    put:
      operationId: completeBrowserLearningStep
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Persisted step completion and updated session cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{id}/review-attempts:
    get:
      operationId: listBrowserReviewAttempts
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Safe persisted review-attempt history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewAttempt"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    post:
      operationId: createBrowserReviewAttempt
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: New or established in-progress review attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InProgressReviewAttempt"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /review-attempts/{id}:
    get:
      operationId: getBrowserReviewAttempt
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Safe persisted review attempt and submitted answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAttempt"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /review-attempts/{id}/answers/{questionId}:
    put:
      operationId: answerBrowserReviewQuestion
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAnswerRequest"
      responses:
        "200":
          description: Feedback for the answered question only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAnswerFeedback"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /review-attempts/{id}/submit:
    post:
      operationId: submitBrowserReviewAttempt
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Immutable score, completion status, and one next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /lab-references/{id}/reports:
    post:
      operationId: reportBrowserLabReference
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/UiContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabReportRequest"
      responses:
        "202":
          description: Report accepted without changing learning completion.
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning/next-action:
    get:
      operationId: getBrowserNextLearningAction
      parameters:
        - $ref: "#/components/parameters/RoadmapIdQuery"
      responses:
        "200":
          description: Exactly one prioritized next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextAction"
        "401":
          $ref: "#/components/responses/SessionNotActive"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-learning_session
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RoadmapIdQuery:
      name: roadmapId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    UiContractVersion:
      name: X-UI-Contract-Version
      in: header
      required: true
      schema:
        type: string
        pattern: "^1\\.[0-9]+\\.[0-9]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    LogoutCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Required and session-bound when an active session is presented. It is
        not compared on the missing/invalid/already-revoked cleanup branch,
        which can only clear the cookie and redirect after exact Origin validation.
      schema:
        type: string
        minLength: 16
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
  headers:
    RedirectLocation:
      description: Validated redirect target; never derived from an untrusted absolute origin.
      schema:
        type: string
    IssuedSessionCookie:
      description: >-
        Issues a rotated opaque __Host-learning_session cookie with Secure,
        HttpOnly, SameSite=Lax, Path=/, and no Domain. Contract evidence records
        attributes only, never the opaque value.
      schema:
        type: string
    ClearedSessionCookie:
      description: >-
        Clears __Host-learning_session with Max-Age=0/expired value, Secure,
        HttpOnly, SameSite=Lax, Path=/, and no Domain. No prior value is echoed.
      schema:
        type: string
  responses:
    SessionNotActive:
      description: Missing, expired, revoked, or otherwise invalid BFF session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InvalidSession:
      description: Unknown, expired, or revoked cookie; a missing cookie uses the 200 anonymous state.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/ClearedSessionCookie"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Session, Origin, CSRF, lifecycle, or owner policy denied access.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Owner-scoped resource does not exist or is not visible.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Contract-version, idempotency, or state conflict.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationFailed:
      description: Request schema, field, path, or query validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Browser actor or required dependency is temporarily throttled.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: BFF, core, identity, session, or persistence dependency unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GatewayTimeout:
      description: A bounded downstream operation timed out with safe retry semantics.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    BffCapabilities:
      type: object
      additionalProperties: false
      required:
        - bffContractVersion
        - bffApiSchemaVersion
        - acceptedUiContractRange
        - core
        - featureFlags
      properties:
        bffContractVersion:
          type: string
        bffApiSchemaVersion:
          type: string
          const: 1.0.0
        acceptedUiContractRange:
          type: string
        core:
          $ref: "#/components/schemas/CoreCompatibility"
