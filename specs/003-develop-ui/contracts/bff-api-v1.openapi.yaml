        displayName:
          type: string
          minLength: 1
    EmployeeProfileInput:
      type: object
      additionalProperties: false
      required: [role, experienceLevel, targetRole, availableTimePerWeek]
      properties:
        id:
          type: string
          description: Compatibility relationship only; never grants authority.
        role:
          type: string
          minLength: 1
        experienceLevel:
          type: string
          enum: [unknown, beginner, intermediate, advanced, lead]
        targetRole:
          type: string
          minLength: 1
        targetSpecializations:
          type: array
          items:
            type: string
            minLength: 1
        availableTimePerWeek:
          type: integer
          minimum: 0
        learningPreferences:
          type: array
          items:
            type: string
            minLength: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
    RoadmapCreateRequest:
      type: object
      additionalProperties: false
      required: [employeeProfile]
      properties:
        employeeProfile:
          $ref: "#/components/schemas/EmployeeProfileInput"
        requestText:
          type: [string, "null"]
        clarifyingQuestionsAsked:
          type: integer
          minimum: 0
          default: 0
    GuidanceRequest:
      type: object
      additionalProperties: false
      required: [topic, employeeProfile]
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 128
          description: Active ID or alias from supported-guidance-topics-v1.yaml.
        employeeProfile:
          $ref: "#/components/schemas/EmployeeProfileInput"
        requestText:
          type: [string, "null"]
    ProgressCheckInRequest:
      type: object
      additionalProperties: false
      required: [roadmapId]
      properties:
        employeeProfileId:
          type: [string, "null"]
          deprecated: true
          description: Compatibility relationship only; never grants authority.
        roadmapId:
          type: string
          minLength: 1
        notes:
          type: string
          default: ""
        completedSteps:
          type: array
          description: >-
            Legacy milestone title and skill-area references retain their
            documented trim/case-insensitive all-matches behavior.
          items:
            type: string
            minLength: 1
        completedMilestoneKeys:
          type: array
          description: >-
            Preferred unambiguous stable keys. An unknown key is a 422 error.
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]{2,127}$"
        newGoals:
          type: array
          items:
            type: string
            minLength: 1
    ReviewAnswerRequest:
      type: object
      additionalProperties: false
      required: [answerKey]
      properties:
        answerKey:
          type: string
          minLength: 1
    LabReportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [unavailable, unsuitable, cost_mismatch, other]
        comment:
          type: [string, "null"]
          maxLength: 1000
