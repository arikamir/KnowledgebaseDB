          oneOf:
            - $ref: "#/components/schemas/ProgressCheckIn"
            - type: "null"
        roadmap_id:
          type: string
        current_status:
          type: string
        gaps:
          type: array
          items:
            type: string
        milestones:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoadmapMilestone"
        next_action:
          $ref: "#/components/schemas/NextAction"
    NextAction:
      type: object
      additionalProperties: false
      required: [kind, title, reason, target]
      properties:
        kind:
          type: string
          enum: [retry_material, resume_session, continue_milestone, review_roadmap]
        title:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    ClarifyingQuestion:
      type: object
      additionalProperties: false
      required: [id, prompt, why_it_matters]
      properties:
        id:
          type: string
        prompt:
          type: string
          minLength: 1
        why_it_matters:
          type: string
          minLength: 1
    RoadmapMilestone:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - skill_area
        - experience_level_fit
        - time_horizon
        - concrete_next_action
        - reason_it_matters
        - priority
        - completion_state
        - supporting_notes
      properties:
        id:
          type: string
        milestone_key:
          type: string
          description: >-
            Stable additive identifier. Required on newly persisted owned
            roadmaps; optional only when reading a legacy v1 roadmap.
        ordinal:
          type: integer
          minimum: 0
          description: >-
            Stable ordering value. Required on newly persisted owned roadmaps;
            optional only when reading a legacy v1 roadmap.
        title:
          type: string
          minLength: 1
        skill_area:
          type: string
          minLength: 1
        experience_level_fit:
          type: string
        time_horizon:
          type: string
          enum: [immediate, near_term, long_term]
        concrete_next_action:
          type: string
          minLength: 1
        reason_it_matters:
          type: string
        completion_state:
          type: string
          enum: [pending, in_progress, completed]
        priority:
          type: integer
        supporting_notes:
          type: array
          items:
            type: string
    CareerRoadmap:
      type: object
      additionalProperties: false
      required:
        - id
        - employee_profile_id
        - goal_summary
        - current_focus
        - milestones
        - next_actions
        - status
        - assumptions
        - clarifying_questions_asked
        - created_at
        - updated_at
      properties:
        id:
          type: string
        owner_type:
          type: string
          enum: [employee, application]
          description: >-
            Additive audit/ownership class; no employee or machine principal ID
            is exposed. May be absent only on a legacy v1 record.
        employee_profile_id:
          type: string
          description: Record relationship only; authorization uses token claims.
        previous_roadmap_id:
          type: [string, "null"]
        goal_summary:
          type: string
          minLength: 1
        current_focus:
          type: string
          minLength: 1
        milestones:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoadmapMilestone"
        next_actions:
          type: array
          deprecated: true
          description: >-
            Legacy machine-consumer candidate list retained for v1 compatibility;
            BFF/UI must ignore it and use exactly one NextAction selected by core.
          items:
            $ref: "#/components/schemas/RoadmapMilestone"
        status:
          type: string
          enum: [draft, active, revised, completed]
        assumptions:
          type: array
          items:
            type: string
        clarifying_questions_asked:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OwnedRoadmapMilestone:
      allOf:
        - $ref: "#/components/schemas/RoadmapMilestone"
        - type: object
          required: [milestone_key, ordinal]
    OwnedCareerRoadmap:
      description: >-
        Enriched employee-owned roadmap required on delegated BFF calls. Legacy
        records that cannot be deterministically backfilled return
        LEGACY_RECORD_NOT_UI_COMPATIBLE instead of a partial 200 response.
      allOf:
        - $ref: "#/components/schemas/CareerRoadmap"
        - type: object
          required: [owner_type, milestones]
          properties:
            owner_type:
              type: string
              const: employee
            milestones:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/OwnedRoadmapMilestone"
    OwnedRoadmapResult:
      oneOf:
        - $ref: "#/components/schemas/OwnedReadyRoadmapResult"
        - $ref: "#/components/schemas/NeedsMoreInfoRoadmapResult"
      discriminator:
        propertyName: status
        mapping:
          ready: "#/components/schemas/OwnedReadyRoadmapResult"
          needs_more_info: "#/components/schemas/NeedsMoreInfoRoadmapResult"
    OwnedReadyRoadmapResult:
      allOf:
        - $ref: "#/components/schemas/ReadyRoadmapResult"
        - type: object
          properties:
            roadmap:
              $ref: "#/components/schemas/OwnedCareerRoadmap"
    PersistedRoadmapRevision:
      allOf:
        - $ref: "#/components/schemas/RoadmapRevision"
        - type: object
          required: [normalized_milestone_keys]
          properties:
            prior_roadmap:
              $ref: "#/components/schemas/OwnedCareerRoadmap"
            updated_roadmap:
              $ref: "#/components/schemas/OwnedCareerRoadmap"
    PersistedProgressCheckIn:
      allOf:
        - $ref: "#/components/schemas/ProgressCheckIn"
        - type: object
          required: [owner_type, normalized_milestone_keys]
          properties:
            owner_type:
              type: string
              const: employee
    PersistedProgressReview:
      description: Enriched employee-owned review required on delegated BFF calls.
      allOf:
        - $ref: "#/components/schemas/ProgressReview"
        - type: object
          required: [check_in]
          properties:
            revision:
              $ref: "#/components/schemas/PersistedRoadmapRevision"
            check_in:
              $ref: "#/components/schemas/PersistedProgressCheckIn"
            milestones:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/OwnedRoadmapMilestone"
    LearningStep:
      type: object
      additionalProperties: false
      required: [id, ordinal, step_type, title, status]
      properties:
        id:
          type: string
        ordinal:
          type: integer
          minimum: 0
        step_type:
          type: string
          enum: [reading, activity, lab, review]
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [pending, completed]
        lab_reference:
          oneOf:
            - $ref: "#/components/schemas/LabReference"
            - type: "null"
    ReviewQuestion:
      type: object
      additionalProperties: false
      required: [id, ordinal, prompt, choices]
      properties:
        id:
          type: string
        ordinal:
          type: integer
          minimum: 0
        prompt:
          type: string
          minLength: 1
        choices:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties:
              type: string
          description: Choice keys and display text; correct keys are excluded.
    RoadmapRevision:
      type: object
      additionalProperties: false
      required:
        - prior_roadmap
        - updated_roadmap
        - completed_steps
        - new_goals
        - summary
        - created_at
      properties:
        prior_roadmap:
          $ref: "#/components/schemas/CareerRoadmap"
        updated_roadmap:
          $ref: "#/components/schemas/CareerRoadmap"
        completed_steps:
          type: array
          description: Original compatibility references supplied by the actor.
          items:
            type: string
        normalized_milestone_keys:
          type: array
          description: Stable keys resolved from completed_steps for new records.
          items:
            type: string
        new_goals:
          type: array
          items:
            type: string
        summary:
          type: string
        created_at:
          type: string
          format: date-time
    ProgressCheckIn:
      type: object
      additionalProperties: false
      required:
        - id
        - employee_profile_id
        - roadmap_id
        - notes
        - completed_steps
        - new_goals
        - updated_recommendations
        - created_at
      properties:
        id:
          type: string
        owner_type:
          type: string
          enum: [employee, application]
          description: >-
            Additive actor class. The actual owner identifier remains internal.
        employee_profile_id:
          type: string
        roadmap_id:
          type: string
        notes:
          type: string
        completed_steps:
          type: array
          description: Original compatibility references supplied by the actor.
          items:
            type: string
        normalized_milestone_keys:
          type: array
          description: Stable milestone keys resolved by core for new records.
          items:
            type: string
        new_goals:
          type: array
          items:
            type: string
        updated_recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapMilestone"
        created_at:
          type: string
          format: date-time
    LabReference:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - objective
        - prerequisites
        - estimated_minutes
        - cost_status
        - availability_status
        - destination_url
      properties:
        id:
          type: string
        provider:
          type: string
        objective:
          type: string
        prerequisites:
          type: array
          items:
            type: string
        estimated_minutes:
          type: integer
          minimum: 1
        cost_status:
          type: string
          enum: [free, paid, subscription, unknown]
        availability_status:
          type: string
          enum: [active, unavailable, retired]
        destination_url:
          type: string
          format: uri
          pattern: "^https://"
    LabReportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [unavailable, unsuitable, cost_mismatch, other]
        comment:
          type: [string, "null"]
          maxLength: 1000
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: [string, "null"]
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        retryable:
          type: boolean
        correlation_id:
          type: string
