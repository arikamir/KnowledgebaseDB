        - clarifying_questions
        - assumptions
        - presentation
        - follow_up_prompt
      properties:
        status:
          type: string
          const: ready
        roadmap_id:
          type: string
          minLength: 1
        employee_profile_id:
          type: string
          minLength: 1
        roadmap:
          $ref: "#/components/schemas/CareerRoadmap"
        clarifying_questions:
          type: array
          maxItems: 0
          items:
            $ref: "#/components/schemas/ClarifyingQuestion"
        assumptions:
          type: array
          items:
            type: string
        presentation:
          type: string
        follow_up_prompt:
          type: string
    NeedsMoreInfoRoadmapResult:
      type: object
