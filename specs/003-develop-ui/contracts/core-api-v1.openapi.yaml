      required:
        - id
        - roadmap_id
        - title
        - objective
        - estimated_minutes
        - status
        - current_step_ordinal
        - steps
      properties:
        id:
          type: string
        roadmap_id:
          type: string
        title:
          type: string
        objective:
          type: string
        estimated_minutes:
          type: integer
          minimum: 20
          maximum: 30
        status:
          type: string
          enum: [not_started, in_progress, retry_required, completed]
        current_step_ordinal:
          type: integer
          minimum: 0
        steps:
          type: array
          items:
            $ref: "#/components/schemas/LearningStep"
    ReviewAttempt:
      oneOf:
        - $ref: "#/components/schemas/InProgressReviewAttempt"
        - $ref: "#/components/schemas/SubmittedReviewAttempt"
      discriminator:
        propertyName: status
        mapping:
          in_progress: "#/components/schemas/InProgressReviewAttempt"
          submitted: "#/components/schemas/SubmittedReviewAttempt"
    InProgressReviewAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - attempt_number
        - status
        - questions
        - answers
        - started_at
        - score_percent
        - passed
        - submitted_at
      properties:
        id:
          type: string
        attempt_number:
          type: integer
          minimum: 1
        status:
          type: string
          const: in_progress
        questions:
          type: array
          minItems: 3
          maxItems: 5
