        employee_profile_id:
          type: [string, "null"]
        roadmap:
          type: "null"
        clarifying_questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClarifyingQuestion"
        assumptions:
          type: array
          items:
            type: string
        presentation:
          type: string
        follow_up_prompt:
          type: string
    GuidanceResult:
      type: object
