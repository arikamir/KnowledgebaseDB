    SubmittedReviewAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - attempt_number
        - status
        - questions
        - answers
        - started_at
        - score_percent
        - passed
        - submitted_at
      properties:
        id:
          type: string
        attempt_number:
          type: integer
          minimum: 1
        status:
          type: string
          const: submitted
        questions:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReviewQuestion"
        answers:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: "#/components/schemas/PersistedReviewAnswer"
        started_at:
          type: string
          format: date-time
        score_percent:
          type: number
          minimum: 0
          maximum: 100
        passed:
