openapi: 3.1.0
info:
  title: DevOps Career Agent Core API
  version: 1.0.0
  description: >-
    Contract-first definition of the private core API consumed by the BFF and
    approved machine clients. Employee ownership is always derived from the
    validated delegated token. App-role calls use application ownership derived
    from the validated machine principal; request identity fields never grant
    authority or permit employee/application impersonation.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /capabilities:
    get:
      operationId: getCoreCapabilities
      description: >-
        Private, nonpersonalized capability metadata. The BFF and approved
        machine monitors authenticate with an app-only token containing
        CareerAgent.Health.Read; employee-delegated authorization is not
        required for this read.
      responses:
        "200":
          description: Active core contract and accepted BFF range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /identity/session-bootstrap:
    post:
      operationId: bootstrapEmployeeSession
      description: >-
        Semantically idempotent by the validated delegated tenant and subject;
        repeats return current eligibility without creating duplicate domain
        records and therefore do not accept a domain Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
      responses:
        "200":
          description: The delegated employee is eligible for a BFF session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEligibility"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /roadmaps:
    get:
      operationId: listRoadmaps
      x-delegated-bff-response-schema:
        type: array
        items:
          $ref: "#/components/schemas/OwnedCareerRoadmap"
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
      responses:
        "200":
          description: Owner-scoped persisted roadmaps used for refresh restoration.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerRoadmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    post:
      operationId: createRoadmap
      x-delegated-bff-response-schema:
        $ref: "#/components/schemas/OwnedRoadmapResult"
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapCreateRequest"
      responses:
        "200":
          description: Roadmap result or required clarifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapResult"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /roadmaps/{roadmap_id}:
    get:
      operationId: getRoadmap
      x-delegated-bff-response-schema:
        $ref: "#/components/schemas/OwnedCareerRoadmap"
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - name: roadmap_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Owner-scoped persisted roadmap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerRoadmap"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /guidance:
    post:
      operationId: createGuidance
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuidanceRequest"
      responses:
        "200":
          description: Guidance for a topic present in the active catalog version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidanceResult"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          description: >-
            VALIDATION_FAILED, GUIDANCE_TOPIC_UNINTERPRETABLE, or
            GUIDANCE_TOPIC_UNAVAILABLE; rejected before the idempotency key is
            claimed or domain work begins.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /progress/check-ins:
    post:
      operationId: createProgressCheckIn
      x-delegated-bff-response-schema:
        $ref: "#/components/schemas/PersistedProgressReview"
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressCheckInRequest"
      responses:
        "200":
          description: Current status, gaps, milestones, and one next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReview"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /progress/reviews:
    get:
      operationId: getProgressReview
      x-delegated-bff-response-schema:
        $ref: "#/components/schemas/PersistedProgressReview"
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - name: roadmap_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Latest owner-scoped persisted progress review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReview"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions:
    get:
      operationId: listLearningSessions
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - name: roadmap_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Owner-scoped learning sessions for a roadmap.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningSession"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{session_id}/start:
    post:
      operationId: startLearningSession
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Started or resumed owner-scoped session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{session_id}:
    get:
      operationId: getLearningSession
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Owner-scoped persisted learning session and current cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{session_id}/steps/{step_id}/completion:
    put:
      operationId: completeLearningStep
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionId"
        - name: step_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Updated session cursor and persisted completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning-sessions/{session_id}/review-attempts:
    get:
      operationId: listReviewAttempts
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Persisted owner-scoped review-attempt history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewAttempt"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    post:
      operationId: createReviewAttempt
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: New or established in-progress review attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAttempt"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /review-attempts/{attempt_id}:
    get:
      operationId: getReviewAttempt
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Persisted owner-scoped review attempt and submitted answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAttempt"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /review-attempts/{attempt_id}/answers/{question_id}:
    put:
      operationId: answerReviewQuestion
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: question_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAnswerRequest"
      responses:
        "200":
          description: Immediate feedback for only the answered question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAnswerFeedback"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /review-attempts/{attempt_id}/submit:
    post:
      operationId: submitReviewAttempt
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Immutable score, completion result, and one next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /lab-references/{lab_reference_id}/reports:
    post:
      operationId: reportLabReference
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: lab_reference_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabReportRequest"
      responses:
        "202":
          description: Report accepted without changing learning completion.
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /learning/next-action:
    get:
      operationId: getNextLearningAction
      parameters:
        - $ref: "#/components/parameters/BffContractVersion"
        - name: roadmap_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Exactly one prioritized next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextAction"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BffContractVersion:
      name: X-BFF-Contract-Version
      in: header
      required: false
      description: >-
        Required for state-changing delegated BFF calls. Optional and
        nonsemantic for approved app-role machine consumers so existing
        machine request shapes remain compatible.
      schema:
        type: string
        pattern: "^1\\.[0-9]+\\.[0-9]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Problem:
      description: Stable, non-secret problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Missing, expired, malformed, or otherwise invalid core token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Valid token without required scope, role, owner, or active lifecycle state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Request or required identity/dependency lookup is temporarily throttled.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: A required core dependency is unavailable; no partial mutation is committed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GatewayTimeout:
      description: A required dependency timed out; mutation outcome remains safely retryable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    CoreCapabilities:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - accepted_bff_range
        - api_schema_version
        - guidance_topic_catalog_version
        - enabled_features
      properties:
        contract_version:
          type: string
        accepted_bff_range:
          type: string
        api_schema_version:
          type: string
          const: 1.0.0
        guidance_topic_catalog_version:
          type: string
          const: 1.0.0
        enabled_features:
          type: array
          items:
            type: string
    SessionEligibility:
      type: object
      additionalProperties: false
      required: [eligible, employee_subject, lifecycle_state]
      properties:
        eligible:
          type: boolean
          const: true
        employee_subject:
          type: string
        lifecycle_state:
          type: string
          const: active
    EmployeeProfileInput:
      type: object
      additionalProperties: false
      required: [role, experience_level, target_role, available_time_per_week]
      properties:
        id:
          type: string
          description: Compatibility identifier; never grants employee authority.
        role:
          type: string
          minLength: 1
        experience_level:
          type: string
          enum: [unknown, beginner, intermediate, advanced, lead]
        target_role:
          type: string
          minLength: 1
        target_specializations:
          type: array
          items:
            type: string
            minLength: 1
        available_time_per_week:
          type: integer
          minimum: 0
        learning_preferences:
          type: array
          items:
            type: string
            minLength: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoadmapCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner is derived from authorization: delegated calls create an
        employee-owned roadmap and app-role calls create an application-owned
        roadmap for the validated MachinePrincipal. No request field selects it.
      required: [employee_profile]
      properties:
        employee_profile:
          $ref: "#/components/schemas/EmployeeProfileInput"
        request_text:
          type: [string, "null"]
        clarifying_questions_asked:
          type: integer
          minimum: 0
          default: 0
    GuidanceRequest:
      type: object
      additionalProperties: false
      required: [topic, employee_profile]
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 128
          description: Active ID or alias from supported-guidance-topics-v1.yaml.
        employee_profile:
          $ref: "#/components/schemas/EmployeeProfileInput"
        request_text:
          type: [string, "null"]
    ProgressCheckInRequest:
      type: object
      additionalProperties: false
      description: >-
        Delegated calls may reference only the employee's roadmap; app-role
        calls may reference only a roadmap owned by the same validated
        MachinePrincipal.
      required: [roadmap_id]
      properties:
        employee_profile_id:
          type: [string, "null"]
          deprecated: true
          description: Compatibility-only hint; never grants employee authority.
        roadmap_id:
          type: string
          minLength: 1
        notes:
          type: string
          default: ""
        completed_steps:
          type: array
          description: >-
            Backward-compatible legacy milestone title or skill-area references.
            Existing trim/case-insensitive all-matches behavior is preserved;
            an unknown value is retained but changes no milestone.
          items:
            type: string
            minLength: 1
        completed_milestone_keys:
          type: array
          description: >-
            Preferred unambiguous stable milestone keys. Every supplied key must
            exist in the actor-owned roadmap or the request returns 422.
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]{2,127}$"
        new_goals:
          type: array
          items:
            type: string
            minLength: 1
    RoadmapResult:
      oneOf:
        - $ref: "#/components/schemas/ReadyRoadmapResult"
        - $ref: "#/components/schemas/NeedsMoreInfoRoadmapResult"
      discriminator:
