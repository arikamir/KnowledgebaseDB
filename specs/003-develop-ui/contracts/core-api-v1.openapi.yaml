        - practical_next_action
        - common_pitfalls
        - related_topics
        - suggestions
        - notes
      properties:
        requested_topic:
          type: string
        resolved_topic:
          type: string
        supported:
          type: boolean
          const: true
        topic_summary:
          type: string
        current_level_fit:
          type: string
        practical_next_action:
          type: string
        lab_references:
          type: array
          items:
            $ref: "#/components/schemas/LabReference"
        suggestions:
          type: array
          items:
            type: string
        common_pitfalls:
          type: array
          items:
            type: string
        related_topics:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
    LearningSession:
      type: object
