        submitted_at:
          type: string
          format: date-time
    ReviewAnswerRequest:
      type: object
      additionalProperties: false
      required: [answer_key]
      properties:
        answer_key:
          type: string
          minLength: 1
    ReviewAnswerFeedback:
      type: object
      additionalProperties: false
      required:
        - question_id
        - submitted_answer_key
        - correct
        - explanation
        - answered_at
      properties:
        question_id:
          type: string
        submitted_answer_key:
          type: string
        correct:
          type: boolean
        explanation:
          type: string
          minLength: 1
        answered_at:
          type: string
          format: date-time
    PersistedReviewAnswer:
      type: object
      additionalProperties: false
      description: >-
        Safe restoration DTO. It contains the employee's submitted choice and
        feedback for that answered question, never the authoritative correct
        answer key for any unanswered question.
      required:
        - question_id
        - submitted_answer_key
        - correct
        - explanation
        - answered_at
      properties:
        question_id:
          type: string
        submitted_answer_key:
          type: string
        correct:
          type: boolean
        explanation:
          type: string
          minLength: 1
        answered_at:
          type: string
          format: date-time
    ReviewResult:
      type: object
      additionalProperties: false
      required: [attempt_id, score_percent, passed, session_status, next_action]
      properties:
        attempt_id:
          type: string
        score_percent:
          type: number
          minimum: 0
          maximum: 100
        passed:
          type: boolean
        session_status:
          type: string
          enum: [retry_required, completed]
        next_action:
          $ref: "#/components/schemas/NextAction"
    ProgressReview:
      type: object
      additionalProperties: false
      required:
        - revision
        - presentation
        - follow_up_prompt
        - roadmap_id
        - current_status
        - gaps
        - milestones
        - next_action
      properties:
        revision:
          $ref: "#/components/schemas/RoadmapRevision"
        presentation:
          type: string
        follow_up_prompt:
          type: string
        check_in:
          description: >-
            Non-null for every newly persisted owner-scoped review. Null is
