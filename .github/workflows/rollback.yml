name: Reviewed GitOps rollback

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Git revision containing the last-known-good release declaration"
        required: true
        type: string
      reason:
        description: "Audited rollback reason"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare reviewed declaration reversion
    runs-on: ubuntu-24.04
    environment: nonprod-recovery
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request-number: ${{ steps.rollback-pr.outputs.pull-request-number }}
      pull-request-head-sha: ${{ steps.rollback-pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the target declaration from Git history
        env:
          TARGET_REVISION: ${{ inputs.target_revision }}
        run: |
          git cat-file -e "$TARGET_REVISION^{commit}"
          git show "$TARGET_REVISION:deploy/argocd/environments/nonprod/release.json" > /tmp/last-known-good-release.json
          cp /tmp/last-known-good-release.json deploy/argocd/environments/nonprod/release.json
      - name: Record rollback intent
        run: |
          mkdir -p artifacts
          git show HEAD:deploy/argocd/environments/nonprod/release.json > /tmp/current-release.json
          scripts/ci/prepare-gitops-rollback.sh \
            --from /tmp/current-release.json \
            --to /tmp/last-known-good-release.json \
            --reason "${{ inputs.reason }}" \
            --actor "${GITHUB_ACTOR}" \
            --output artifacts/rollback.json
      - name: Create the rollback pull request
        id: rollback-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/gitops-rollback-${{ github.run_id }}
          delete-branch: true
          title: "chore(rollback): restore last-known-good application declaration"
          commit-message: "chore(rollback): restore last-known-good application declaration"
          body: |
            This is a reviewed Git declaration reversion. Direct Argo CD rollback is not authoritative.
            A verified current-head automated review and protected `main` are required before reconciliation.
      - name: Record rollback review scope
        run: |
          jq -n \
            --arg pr "${{ steps.rollback-pr.outputs.pull-request-number }}" \
            --arg reviewHead "${{ steps.rollback-pr.outputs.pull-request-head-sha }}" \
            '{pullRequest:$pr,reviewedHead:$reviewHead}' \
            > artifacts/rollback-review-scope.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-evidence-${{ github.run_id }}
          path: |
            artifacts/rollback.json
            artifacts/rollback-review-scope.json
          if-no-files-found: warn

  verify-rollback-review:
    name: Verify current-head automated rollback review
    needs: prepare
    runs-on: ubuntu-24.04
    environment: nonprod-recovery
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify automated review before merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.prepare.outputs.pull-request-number }}
          EXPECTED_REVIEW_HEAD: ${{ needs.prepare.outputs.pull-request-head-sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_REVIEW_CHECK_NAME: ai/review
          AI_REVIEW_EVIDENCE_OUTPUT: artifacts/automated-review-evidence.json
          AI_REVIEW_REQUESTER_LOGIN: github-actions[bot]
          AI_REVIEW_MERGE: "true"
        run: scripts/ci/verify-ai-review.sh "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" "$EXPECTED_REVIEW_HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-review-evidence-${{ github.run_id }}
          path: artifacts/automated-review-evidence.json
          if-no-files-found: warn
