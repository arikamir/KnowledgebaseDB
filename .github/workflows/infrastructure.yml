name: Infrastructure validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-infrastructure-validation
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKING_DIR: infra/azure

jobs:
  validate:
    name: Terraform platform validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform without credentials
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Record validation scope evidence
        run: |
          mkdir -p artifacts
          jq -n --arg actor "${GITHUB_ACTOR}" --arg revision "${GITHUB_SHA}" \
            '{workflow:"infrastructure.yml", actor:$actor, sourceRevision:$revision, environment:"identityless-validation", changedResourceSet:["infra/azure"], result:"validation-completed", evidenceLinks:["artifact://infrastructure-validation/"]}' \
            > artifacts/infrastructure-scope.json
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-validation-${{ github.run_id }}
          path: artifacts/infrastructure-scope.json
          if-no-files-found: error
          retention-days: 90
