name: Protected application delivery

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: application-release-nonprod
  cancel-in-progress: false

env:
  DELIVERY_ENVIRONMENT: nonprod
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  validate:
    name: Validate source
    uses: ./.github/workflows/reusable-validate.yml
    secrets: inherit

  verify-release-source:
    name: Verify protected SemVer source
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a protected tag matching the source commit
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_SHA: ${{ github.sha }}
        run: scripts/ci/derive-release-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  publish:
    name: Build, scan, and publish immutable images
    needs: [validate, verify-release-source]
    runs-on: ubuntu-24.04
    environment: nonprod-publisher
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: change-plan-${{ github.run_id }}
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Azure OIDC login (publisher only)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Login to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.59.1/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.59.1
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh | sudo sh -s -- -b /usr/local/bin v1.18.1
      - name: Build, scan, and publish digest-pinned images
        env:
          RELEASE_DIR: artifacts/release
          DELIVERY_STATE: artifacts/delivery-state
        run: |
          mkdir -p "$RELEASE_DIR" "$DELIVERY_STATE"
          scripts/ci/build-publish.sh publish \
            --plan artifacts/change-plan.json \
            --build-id "github-${GITHUB_RUN_ID}" \
            --revision "$GITHUB_SHA" \
            --registry "$ACR_LOGIN_SERVER" \
            --output-dir "$RELEASE_DIR" \
            --state-dir "$DELIVERY_STATE/unpromoted"
      - name: Write and validate the release bundle
        env:
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          scripts/ci/write-gitops-release.sh \
            --manifest artifacts/release/release-manifest.json \
            --tag "$GITHUB_REF_NAME" \
            --source-revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output-bundle artifacts/release/release-bundle.json \
            --output-declaration artifacts/release/nonprod-release.json
      - name: Check platform readiness without mutation
        run: scripts/ci/check-gitops-platform-ready.sh --mode static --output artifacts/release/readiness.json
      - name: Write application workflow scope evidence
        run: |
          jq -n --arg actor "${GITHUB_ACTOR}" --arg revision "${GITHUB_SHA}" \
            '{workflow:"delivery.yml", actor:$actor, sourceRevision:$revision, environment:"nonprod", changedResourceSet:["deploy/argocd/environments/nonprod/release.json"], result:"bundle-ready", evidenceLinks:["artifact://published-release/"]}' \
            > artifacts/release/workflow-scope.json
      - uses: actions/upload-artifact@v4
        with:
          name: published-release-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90

  open-release-pr:
    name: Open reviewed desired-state pull request
    needs: [verify-release-source, publish]
    runs-on: ubuntu-24.04
    environment: nonprod-release
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      pull-request-number: ${{ steps.release-pr.outputs.pull-request-number }}
      pull-request-head-sha: ${{ steps.release-pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: published-release-${{ github.run_id }}
          path: artifacts
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install the sole desired-state declaration
        run: |
          cp artifacts/release/nonprod-release.json deploy/argocd/environments/nonprod/release.json
          scripts/ci/validate-gitops-release.sh
      - name: Create or update the bot release branch and pull request
        id: release-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/gitops-release-${{ github.ref_name }}
          delete-branch: true
          title: "chore(release): reconcile ${{ github.ref_name }} in nonprod"
          commit-message: "chore(release): reconcile ${{ github.ref_name }} in nonprod"
          body: |
            This bot-authored pull request is the reviewed desired-state hand-off.
            It contains only the immutable UI/BFF/Core release declaration.
            A verified current-head automated review and protected `main` are required before merge.
          labels: gitops-release
      - name: Publish release PR scope evidence
        run: |
          jq -n --arg actor "${GITHUB_ACTOR}" --arg revision "${GITHUB_SHA}" \
            --arg pr "${{ steps.release-pr.outputs.pull-request-number }}" \
            --arg reviewHead "${{ steps.release-pr.outputs.pull-request-head-sha }}" \
            '{workflow:"delivery.yml", actor:$actor, sourceRevision:$revision, environment:"nonprod", pullRequest:$pr, reviewedHead:$reviewHead, changedResourceSet:["deploy/argocd/environments/nonprod/release.json"], result:"automated-review-required", evidenceLinks:["artifact://published-release/"]}' \
            > release-workflow-scope.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-release-scope-${{ github.run_id }}
          path: release-workflow-scope.json
          if-no-files-found: warn
          retention-days: 90

  verify-release-review:
    name: Verify current-head automated review
    needs: open-release-pr
    runs-on: ubuntu-24.04
    environment: nonprod-release
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the required automated review status
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.open-release-pr.outputs.pull-request-number }}
          EXPECTED_REVIEW_HEAD: ${{ needs.open-release-pr.outputs.pull-request-head-sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_REVIEW_CHECK_NAME: ai/review
          AI_REVIEW_EVIDENCE_OUTPUT: artifacts/automated-review-evidence.json
          AI_REVIEW_REQUESTER_LOGIN: github-actions[bot]
          AI_REVIEW_MERGE: "true"
        run: scripts/ci/verify-ai-review.sh "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" "$EXPECTED_REVIEW_HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-review-evidence-${{ github.run_id }}
          path: artifacts/automated-review-evidence.json
          if-no-files-found: warn
          retention-days: 90
