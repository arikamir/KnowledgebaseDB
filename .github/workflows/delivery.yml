name: Protected delivery

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      delivery_action:
        description: 'normal publishes and promotes; rebuild-all requires two-person approval'
        required: true
        default: normal
        type: choice
        options: [normal, rebuild-all, recovery]
      recovery_reference:
        description: 'Quarantined attempt ID for recovery'
        required: false
        type: string
      recovery_run_id:
        description: 'GitHub Actions run ID containing quarantined delivery state'
        required: false
        type: string
      action_reason:
        description: 'Audited reason for rebuild or recovery'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: delivery-nonprod
  cancel-in-progress: false

env:
  DELIVERY_ENVIRONMENT: nonprod
  DELIVERY_NAMESPACE: career-agent
  PLATFORM_MANIFEST: config/platform-bootstrap-nonprod.json
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  EVIDENCE_STORAGE_ACCOUNT: ${{ vars.EVIDENCE_STORAGE_ACCOUNT }}
  CORE_SMOKE_URL: ${{ vars.CORE_SMOKE_URL }}
  BFF_SMOKE_URL: ${{ vars.BFF_SMOKE_URL }}
  UI_SMOKE_URL: ${{ vars.UI_SMOKE_URL }}
  ACTION_REASON: ${{ inputs.action_reason || '' }}
  RECOVERY_REFERENCE: ${{ inputs.recovery_reference || '' }}
  RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
  DELIVERY_ACTION: ${{ inputs.delivery_action || 'normal' }}

jobs:
  validate:
    name: Validate source
    uses: ./.github/workflows/reusable-validate.yml
    secrets: inherit

  publish:
    name: Build, scan, and publish
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.delivery_action != 'recovery'
    runs-on: ubuntu-24.04
    environment: nonprod-publisher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: change-plan-${{ github.run_id }}
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Azure OIDC login (publisher)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Login to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.59.1/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.59.1
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh | sudo sh -s -- -b /usr/local/bin v1.18.1
      - name: Build, scan, and publish immutable digests
        env:
          RELEASE_DIR: artifacts/release
          DELIVERY_STATE: artifacts/delivery-state
        run: |
          mkdir -p "$RELEASE_DIR" "$DELIVERY_STATE"
          scripts/ci/build-publish.sh publish \
            --plan artifacts/change-plan.json \
            --build-id "github-${GITHUB_RUN_ID}" \
            --revision "$GITHUB_SHA" \
            --registry "$ACR_LOGIN_SERVER" \
            --output-dir "$RELEASE_DIR" \
            --state-dir "$DELIVERY_STATE/unpromoted"
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: published-release-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Promote and verify
    needs: [validate, publish]
    if: github.event_name != 'workflow_dispatch' || inputs.delivery_action != 'recovery'
    runs-on: ubuntu-24.04
    environment: nonprod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: change-plan-${{ github.run_id }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: published-release-${{ github.run_id }}
          path: artifacts
      - name: Azure OIDC login (deployer)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Configure AKS context
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
      - name: Run live preflight
        run: |
          test -f "$PLATFORM_MANIFEST"
          scripts/azure/preflight-ui-platform.sh live --repo-root "$GITHUB_WORKSPACE" --manifest "$PLATFORM_MANIFEST"
          scripts/azure/validate-delivery-identities.sh --mode live --manifest "$PLATFORM_MANIFEST" --report artifacts/delivery-identities.json
      - name: Acquire environment lock
        run: |
          mkdir -p artifacts/delivery-state/locks
          scripts/ci/environment-lock.sh acquire \
            --state-dir artifacts/delivery-state/locks \
            --environment "$DELIVERY_ENVIRONMENT" \
            --attempt "github-${GITHUB_RUN_ID}" \
            --revision "$GITHUB_SHA" \
            --expected-revision "$GITHUB_SHA"
      - name: Promote, migrate, and verify
        run: |
          trap 'scripts/ci/environment-lock.sh release --state-dir artifacts/delivery-state/locks --environment "$DELIVERY_ENVIRONMENT" --attempt "github-${GITHUB_RUN_ID}"' EXIT
          scripts/ci/promote.sh \
            --manifest artifacts/release/release-manifest.json \
            --journal-dir artifacts/delivery-state \
            --attempt "github-${GITHUB_RUN_ID}" \
            --environment "$DELIVERY_ENVIRONMENT" \
            --snapshot-out "artifacts/delivery-state/github-${GITHUB_RUN_ID}.snapshot.json"
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 90

  recovery:
    name: Two-person recovery
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.delivery_action == 'recovery'
    runs-on: ubuntu-24.04
    environment: nonprod-recovery
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download quarantined delivery state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}
          pattern: delivery-evidence-*
          merge-multiple: true
          path: artifacts
      - name: Azure OIDC login (deployer)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure AKS context
        run: az aks get-credentials --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --name "${{ vars.AKS_CLUSTER_NAME }}" --overwrite-existing
      - name: Require distinct recovery identities
        env:
          RECOVERY_OPERATOR: ${{ github.actor }}
          PLATFORM_APPROVER: ${{ vars.PLATFORM_APPROVER }}
        run: |
          test -n "$RECOVERY_REFERENCE" -a -n "$ACTION_REASON"
          test -n "$PLATFORM_APPROVER" -a "$RECOVERY_OPERATOR" != "$PLATFORM_APPROVER"
          scripts/ci/rollback.sh recover \
            --journal-dir artifacts/delivery-state \
            --attempt "$RECOVERY_REFERENCE" \
            --namespace "$DELIVERY_ENVIRONMENT" \
            --operator "$RECOVERY_OPERATOR" \
            --operator-role delivery-recovery-operator \
            --approver "$PLATFORM_APPROVER" \
            --approver-role platform-operations
